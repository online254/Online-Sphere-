<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <title>Online Sphere</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,sans-serif;background:#07111f;color:#f5f8fc}body{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 42%,#153666 0,#0a192b 38%,#050b14 78%)}.boot{width:min(92vw,400px);text-align:center;padding:35px}.globe{width:clamp(100px,32vw,160px);margin:0 auto 20px;animation:spin 4s linear infinite;filter:drop-shadow(0 0 25px #2563eb55)}.globe svg{display:block;width:100%}.brand{font-weight:800;font-size:clamp(22px,6vw,32px);letter-spacing:3px;background:linear-gradient(90deg,#60a5fa,#55d9c8,#b58aff);background-clip:text;color:transparent}.tagline{margin:9px 0 24px;color:#99aec1;font-size:12px;letter-spacing:1px}.progress{height:3px;max-width:180px;margin:auto;background:#ffffff16;border-radius:4px;overflow:hidden}.progress i{display:block;height:100%;width:35%;border-radius:4px;background:linear-gradient(90deg,#2563eb,#55d9c8);animation:load 1.1s ease-in-out infinite alternate}.status{color:#8199ad;font-size:11px;margin-top:14px}@keyframes spin{to{transform:rotate(360deg)}}@keyframes load{to{width:100%}}@media(prefers-reduced-motion:reduce){.globe,.progress i{animation:none}}
  </style>
  <script defer src="./public/entry.js"></script>
</head>
<body>
  <main class="boot" aria-live="polite">
    <div class="globe" aria-hidden="true"><svg viewBox="0 0 120 120" fill="none"><circle cx="60" cy="60" r="48" stroke="#60a5fa" stroke-width="3"/><ellipse cx="60" cy="60" rx="21" ry="48" stroke="#55d9c8" stroke-width="2"/><ellipse cx="60" cy="60" rx="48" ry="17" stroke="#55d9c8" stroke-width="2"/><path d="M16 43c28 12 60 12 88 0M16 77c28-12 60-12 88 0" stroke="#8b7bfa" stroke-width="2"/><circle cx="60" cy="60" r="5" fill="#ffbd59"/></svg></div>
    <div class="brand">ONLINE SPHERE</div><p class="tagline">DISCOVER. LEARN. WORK.</p>
    <div class="progress" aria-hidden="true"><i></i></div><div class="status" id="bootStatus">Preparing your digital workspace…</div>
    <noscript><p><a href="./public/auth.html">Continue to sign in</a></p></noscript>
  </main>
</body>
</html>
