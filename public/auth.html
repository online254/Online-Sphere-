<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#07111f">
  <title>Account access | Online Sphere</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:dark;--bg:#07111f;--line:#ffffff1a;--text:#f4f7ff;--muted:#a7b5ca;--blue:#2563eb;--purple:#7c3aed;--cyan:#55d9c8}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 10% 5%,#2563eb25,transparent 38%),radial-gradient(ellipse at 90% 95%,#7c3aed24,transparent 40%),var(--bg);color:var(--text);font:14px/1.6 'DM Sans',sans-serif}button,input{font:inherit}.card{width:min(100%,440px);padding:30px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,#122139,#0b1728);box-shadow:0 25px 80px #0005}.brand{display:flex;align-items:center;gap:11px;margin-bottom:25px;font:700 18px 'Space Grotesk',sans-serif;color:inherit;text-decoration:none}.mark{width:39px;height:39px;display:grid;place-items:center;border-radius:13px;background:linear-gradient(135deg,var(--blue),var(--purple))}.brand b{color:#91aaff}.tabs{display:grid;grid-template-columns:1fr 1fr;padding:5px;border:1px solid var(--line);border-radius:13px;background:#050d18}.tabs button{padding:10px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-weight:700;cursor:pointer}.tabs button.active{background:linear-gradient(110deg,var(--blue),var(--purple));color:white}h1{font:700 27px 'Space Grotesk',sans-serif;margin:22px 0 4px}p{color:var(--muted);margin:0 0 20px}.field{margin:15px 0}.field label{display:block;margin-bottom:7px;font-size:12px;font-weight:700}.field input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:11px;background:#07111f;color:white;outline:none}.field input:focus{border-color:#638aff;box-shadow:0 0 0 3px #2563eb20}.field-hint{margin:7px 0 0;color:var(--cyan);font-size:11px}.submit{width:100%;padding:13px;border:0;border-radius:12px;background:linear-gradient(110deg,var(--blue),var(--purple));color:white;font-weight:700;cursor:pointer}.submit:disabled{opacity:.6;cursor:wait}.notice{display:none;margin-top:14px;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:12px;overflow-wrap:anywhere}.notice.show{display:block}.notice.error{color:#ffb8b8;background:#e5484812}.notice.info{color:#c3d3ff;background:#2563eb16}.switch{margin:18px 0 0;text-align:center;font-size:12px}.switch button{border:0;background:none;color:#b1c3ff;font-weight:700;cursor:pointer}.security{margin-top:22px;padding-top:15px;border-top:1px solid var(--line);color:#8294a8;font-size:11px}[hidden]{display:none!important}@media(max-width:480px){.card{padding:23px 18px}}
  </style>
</head>
<body>
  <main class="card">
    <a class="brand" href="../index.html"><span class="mark">◎</span><span>ONLINE <b>SPHERE</b></span></a>
    <div class="tabs" role="tablist" aria-label="Account access"><button id="loginTab" class="active" type="button" role="tab" aria-selected="true">Sign in</button><button id="registerTab" type="button" role="tab" aria-selected="false">Create account</button></div>
    <h1 id="title">Welcome back</h1><p id="subtitle">Sign in to continue to your dashboard.</p>
    <form id="authForm" novalidate>
      <div class="field" id="nameField" hidden><label for="fullName">Full name</label><input id="fullName" autocomplete="name" minlength="2"></div>
      <div class="field" id="identifierField"><label id="identifierLabel" for="identifier">Email or phone number</label><input id="identifier" type="text" autocomplete="username" inputmode="email" placeholder="you@example.com or 07XXXXXXXX" required><p class="field-hint" id="identifierHint">Use the email address or phone number on your account.</p></div>
      <div class="field" id="emailField" hidden><label for="email">Email address</label><input id="email" type="email" autocomplete="email"></div>
      <div class="field" id="phoneField" hidden><label for="phone">Phone number</label><input id="phone" type="tel" autocomplete="tel"></div>
      <div class="field"><label id="passwordLabel" for="password">Password</label><input id="password" type="password" minlength="8" autocomplete="current-password"></div>
      <div class="field" id="confirmationField" hidden><label for="passwordConfirmation">Confirm password</label><input id="passwordConfirmation" type="password" minlength="8" autocomplete="new-password"></div>
      <button class="submit" id="submitButton" type="submit">Sign in</button><div class="notice" id="notice" role="status" aria-live="polite"></div>
    </form>
    <p class="switch" id="switchText">New to Online Sphere? <button id="switchButton" type="button">Create an account</button></p>
    <div class="security">Your account is protected by the Online Sphere account service. Never share your password or M-Pesa PIN.</div>
  </main>
<script>
(() => {
  'use strict';
  const API_BASE = String(window.ONLINE_SPHERE_API_URL || 'https://online-sphere-backend.onrender.com').replace(/\/$/, '');
  const form = document.getElementById('authForm');
  const notice = document.getElementById('notice');
  const button = document.getElementById('submitButton');
  const password = document.getElementById('password');
  const identifier = document.getElementById('identifier');
  let mode = new URLSearchParams(location.search).get('mode') === 'register' ? 'register' : 'login';
  const notify = (message, type = 'info') => { notice.textContent = message; notice.className = `notice show ${type}`; };
  const api = async (path, body) => {
    const response = await fetch(`${API_BASE}${path}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
      credentials: 'include',
      body: JSON.stringify(body)
    });
    const result = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(result.message || 'The account service is temporarily unavailable.');
    return result;
  };
  const wireSwitch = () => document.getElementById('switchButton').addEventListener('click', () => setMode(mode === 'login' ? 'register' : 'login'));
  function setMode(next) {
    mode = next;
    const registering = mode === 'register';
    document.getElementById('loginTab').classList.toggle('active', !registering);
    document.getElementById('registerTab').classList.toggle('active', registering);
    document.getElementById('loginTab').setAttribute('aria-selected', String(!registering));
    document.getElementById('registerTab').setAttribute('aria-selected', String(registering));
    document.getElementById('nameField').hidden = !registering;
    document.getElementById('phoneField').hidden = !registering;
    document.getElementById('emailField').hidden = !registering;
    document.getElementById('fullName').required = registering;
    identifier.required = !registering;
    document.getElementById('email').required = registering;
    document.getElementById('phone').required = registering;
    document.getElementById('confirmationField').hidden = !registering;
    document.getElementById('passwordConfirmation').required = registering;
    password.required = true;
    identifier.hidden = registering;
    document.getElementById('identifierField').hidden = registering;
    document.getElementById('identifierLabel').textContent = 'Email or phone number';
    document.getElementById('identifierHint').textContent = 'Use the email address or phone number on your account.';
    document.getElementById('title').textContent = registering ? 'Create your account' : 'Welcome back';
    document.getElementById('subtitle').textContent = registering ? 'Create an account to start using Online Sphere.' : 'Sign in to continue to your dashboard.';
    document.getElementById('passwordLabel').textContent = 'Password';
    button.textContent = registering ? 'Create account' : 'Sign in';
    password.autocomplete = registering ? 'new-password' : 'current-password';
    document.getElementById('switchText').innerHTML = registering ? 'Already a member? <button id="switchButton" type="button">Sign in</button>' : 'New to Online Sphere? <button id="switchButton" type="button">Create an account</button>';
    wireSwitch();
    notice.className = 'notice';
  }
  document.getElementById('loginTab').addEventListener('click', () => setMode('login'));
  document.getElementById('registerTab').addEventListener('click', () => setMode('register'));
  wireSwitch();
  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    if (!form.reportValidity()) return;
    button.disabled = true;
    try {
      button.textContent = mode === 'register' ? 'Creating account…' : 'Signing in…';
      const body = { identifier: identifier.value.trim(), password: password.value };
      if (mode === 'register') {
        body.fullName = document.getElementById('fullName').value.trim();
        body.phone = document.getElementById('phone').value.trim();
        body.email = document.getElementById('email').value.trim();
        body.passwordConfirmation = document.getElementById('passwordConfirmation').value;
        const ref = new URLSearchParams(location.search).get('ref');
        if (ref) body.ref = ref;
      }
      await api(`/api/auth/${mode === 'register' ? 'register' : 'login'}`, body);
      notify(mode === 'register' ? 'Account created.' : 'Signed in successfully.');
      window.location.replace('dashboard.html');
    } catch (error) {
      notify(error.message || 'Unable to reach the account service. Please try again.', 'error');
    } finally {
      button.disabled = false;
    }
  });
  setMode(mode);
})();
</script>
</body>
</html>
